# Tests the MLAT server core (software/adsbee_mlat/core). The end-to-end tests use the simulator in
# software/adsbee_mlat/sim when it is present and are skipped otherwise.
name: adsbee_mlat_core

on:
  push:
    branches: [main]
    paths:
      - "software/adsbee_mlat/core/**"
      - "software/adsbee_mlat/sim/**"
      - ".github/workflows/adsbee_mlat_core.yml"
  pull_request:
    paths:
      - "software/adsbee_mlat/core/**"
      - "software/adsbee_mlat/sim/**"
      - ".github/workflows/adsbee_mlat_core.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: software/adsbee_mlat/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[test]'
      - name: Install the simulator if present
        run: if [ -d ../sim ]; then pip install -e ../sim; fi
      - run: pytest -q
      - name: Docker image builds
        run: docker build -t adsbee-mlat-core .
