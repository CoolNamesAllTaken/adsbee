name: adsbee_fleet

on:
  push:
    branches: [ "main" ]
    paths: [ "software/adsbee_fleet/**", ".github/workflows/adsbee_fleet.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "software/adsbee_fleet/**", ".github/workflows/adsbee_fleet.yml" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/adsbee_fleet
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: fleet, POSTGRES_USER: fleet, POSTGRES_PASSWORD: fleet}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fleet" --health-interval 5s --health-retries 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: "3.12"}
    - run: pip install "poetry>=2.1,<3"
    - run: poetry install --with dev --extras server --no-interaction
    - name: Migrations are committed
      run: poetry run python manage.py makemigrations --check --dry-run
    - name: Tests (SQLite)
      run: poetry run pytest -q
    - name: Tests (Postgres)
      run: poetry run pytest -q
      env: {FLEET_TEST_POSTGRES: "1"}
    - name: Docker image builds
      run: docker build -f docker/Dockerfile .
