[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adsbee_mlat"
version = "0.1.0"
description = "ADSBee multilateration (MLAT) server core"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "redis>=5"]

[project.optional-dependencies]
test = ["pytest>=7", "fakeredis>=2.20"]

[project.scripts]
adsbee-mlat = "adsbee_mlat.__main__:main"

[tool.setuptools]
packages = ["adsbee_mlat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
