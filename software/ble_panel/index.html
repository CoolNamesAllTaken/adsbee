<!DOCTYPE html>
<!-- ADSBee BLE Panel: browser-based status/traffic/console over Bluetooth LE (Web Bluetooth).
     Functional counterpart of the embedded WiFi web UI for receivers running in BLE mode.
     Requires Chrome/Edge (desktop or Android) served over HTTPS or localhost.
     Services: ADS-B Receiver Service (0BEE0001-...) for GDL90 data, Nordic UART Service for the AT console. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADSBee BLE Panel</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #101418; color: #e0e6ea; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #1a2027; }
  header h1 { font-size: 18px; margin: 0; }
  button { background: #2a6db0; color: white; border: 0; border-radius: 4px; padding: 8px 14px; cursor: pointer; }
  button:disabled { background: #444; }
  #state { font-size: 13px; color: #9ab; }
  main { padding: 12px 16px; display: grid; gap: 14px; }
  section { background: #1a2027; border-radius: 6px; padding: 12px; }
  h2 { font-size: 14px; margin: 0 0 8px; color: #8fb8dd; text-transform: uppercase; letter-spacing: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid #2a3138; font-variant-numeric: tabular-nums; }
  th { color: #7f8b95; font-weight: 500; }
  #statusgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; font-size: 13px; }
  #statusgrid div { background: #131920; padding: 6px 10px; border-radius: 4px; }
  #statusgrid b { display: block; color: #7f8b95; font-weight: 500; font-size: 11px; }
  #term { background: #0a0e12; border-radius: 4px; padding: 8px; height: 220px; overflow-y: auto;
          font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  #cmdrow { display: flex; gap: 8px; margin-top: 8px; }
  #cmd { flex: 1; background: #0a0e12; color: #e0e6ea; border: 1px solid #2a3138; border-radius: 4px;
         padding: 8px; font-family: ui-monospace, monospace; }
  .stale { color: #666; }
</style>
</head>
<body>
<header>
  <h1>ADSBee BLE Panel</h1>
  <button id="connect">Connect</button>
  <span id="state">Not connected</span>
</header>
<main>
  <section>
    <h2>Status</h2>
    <div id="statusgrid">
      <div><b>Uptime</b><span id="uptime">—</span></div>
      <div><b>1090ES msgs</b><span id="c1090">—</span></div>
      <div><b>978 ADS-B msgs</b><span id="c978">—</span></div>
      <div><b>978 FIS-B msgs</b><span id="cfisb">—</span></div>
      <div><b>Uplink notifies</b><span id="uplinkcount">0</span></div>
      <div><b>Heartbeats</b><span id="hbcount">0</span></div>
      <div><b>Traffic msgs</b><span id="trafficcount">0</span></div>
      <div><b>MTU</b><span id="mtu">—</span></div>
    </div>
  </section>
  <section>
    <h2>Traffic</h2>
    <table>
      <thead><tr><th>ICAO</th><th>Callsign</th><th>Lat</th><th>Lon</th><th>Alt ft</th><th>Kts</th><th>Trk</th><th>Age</th></tr></thead>
      <tbody id="traffic"></tbody>
    </table>
  </section>
  <section>
    <h2>AT Console</h2>
    <div id="term"></div>
    <div id="cmdrow">
      <input id="cmd" placeholder="AT+NETWORK_INFO?" autocomplete="off">
      <button id="send" disabled>Send</button>
    </div>
  </section>
</main>
<script>
"use strict";

const ADSB_SVC = "0bee0001-1090-46f0-a9ac-52d6be4c29cc";
const CH = {
  traffic: "0bee0010-1090-46f0-a9ac-52d6be4c29cc",
  ownship: "0bee0011-1090-46f0-a9ac-52d6be4c29cc",
  status:  "0bee0012-1090-46f0-a9ac-52d6be4c29cc",
  uplink:  "0bee0013-1090-46f0-a9ac-52d6be4c29cc",
};
const NUS_SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // write: console input
const NUS_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // notify: console output

const $ = id => document.getElementById(id);
let device = null, nusRx = null;
let hbCount = 0, trafficCount = 0;
const bandTotals = { c1090: 0, c978: 0, cfisb: 0 };
const targets = new Map(); // icao -> {row fields, last}

// ---- GDL90 decoding ------------------------------------------------------

// Unframe one notification payload: [0x7E][ID][payload...][CRC16][0x7E] with 0x7D byte stuffing.
function unframe(buf) {
  const b = new Uint8Array(buf);
  if (b.length < 5 || b[0] !== 0x7e || b[b.length - 1] !== 0x7e) return null;
  const out = [];
  for (let i = 1; i < b.length - 1; i++) {
    if (b[i] === 0x7d) { out.push(b[++i] ^ 0x20); } else { out.push(b[i]); }
  }
  return new Uint8Array(out.slice(0, -2)); // drop CRC (BLE link is already checked)
}

function semicircles(b0, b1, b2) {
  let v = (b0 << 16) | (b1 << 8) | b2;
  if (v & 0x800000) v -= 0x1000000;
  return v * (180 / 8388608);
}

function parseTraffic(p) { // p = unframed bytes, p[0] = 0x14 or 0x0A
  const icao = (p[2] << 16) | (p[3] << 8) | p[4];
  const lat = semicircles(p[5], p[6], p[7]);
  const lon = semicircles(p[8], p[9], p[10]);
  const altRaw = (p[11] << 4) | (p[12] >> 4);
  const alt = altRaw === 0xfff ? null : altRaw * 25 - 1000;
  const kts = (p[14] << 4) | (p[15] >> 4);
  const trk = Math.round(p[17] * 360 / 256);
  let callsign = "";
  for (let i = 19; i < 27 && i < p.length; i++) {
    const c = p[i]; if (c >= 32 && c < 127) callsign += String.fromCharCode(c);
  }
  return { icao, lat, lon, alt, kts: kts === 0xfff ? null : kts, trk, callsign: callsign.trim() };
}

function fmt(v, digits = 4) { return v == null ? "—" : (typeof v === "number" ? v.toFixed(digits) : v); }

function renderTraffic() {
  const now = Date.now();
  const rows = [...targets.values()]
    .sort((a, b) => a.icao - b.icao)
    .map(t => {
      const age = Math.round((now - t.last) / 1000);
      const cls = age > 15 ? ' class="stale"' : "";
      return `<tr${cls}><td>${t.icao.toString(16).toUpperCase().padStart(6, "0")}</td>` +
        `<td>${t.callsign || "—"}</td><td>${fmt(t.lat)}</td><td>${fmt(t.lon)}</td>` +
        `<td>${t.alt ?? "—"}</td><td>${t.kts ?? "—"}</td><td>${t.trk}°</td><td>${age}s</td></tr>`;
    });
  $("traffic").innerHTML = rows.join("") || '<tr><td colspan="8" class="stale">no targets</td></tr>';
}
setInterval(renderTraffic, 1000);

function onData(kind, ev) {
  const p = unframe(ev.target.value.buffer);
  if (!p) return;
  const id = p[0];
  if (id === 0x00) { // heartbeat: [id][st1][st2][ts lo][ts hi]...
    hbCount++;
    $("hbcount").textContent = hbCount;
    $("uptime").textContent = `${(p[3] | (p[4] << 8))} s`;
  } else if (id === 0x14) {
    trafficCount++;
    $("trafficcount").textContent = trafficCount;
    const t = parseTraffic(p);
    t.last = Date.now();
    targets.set(t.icao, t);
  } else if (id === 0x07) {
    $("uplinkcount").textContent = (parseInt($("uplinkcount").textContent) || 0) + 1;
  } else if (id === 0x65 && p[1] === 0x01 && p.length >= 14) {
    // Vendor per-band metrics: little-endian u32 frame counts for the last
    // reporting interval; accumulate into running totals.
    const u32 = o => p[o] | (p[o+1] << 8) | (p[o+2] << 16) | (p[o+3] << 24);
    bandTotals.c1090 += u32(2);
    bandTotals.c978 += u32(6);
    bandTotals.cfisb += u32(10);
    for (const k of Object.keys(bandTotals)) $(k).textContent = bandTotals[k];
  }
}

// ---- Console -------------------------------------------------------------

const termDecoder = new TextDecoder();
function termWrite(text) {
  const term = $("term");
  term.textContent = (term.textContent + text).slice(-20000);
  term.scrollTop = term.scrollHeight;
}

async function sendCmd() {
  const text = $("cmd").value.trim();
  if (!text || !nusRx) return;
  termWrite(`\n> ${text}\n`);
  $("cmd").value = "";
  const bytes = new TextEncoder().encode(text + "\r\n");
  // NUS RX writes are capped by MTU; chunk conservatively.
  for (let i = 0; i < bytes.length; i += 180) {
    await nusRx.writeValueWithoutResponse(bytes.slice(i, i + 180));
  }
}
$("send").onclick = sendCmd;
$("cmd").addEventListener("keydown", e => { if (e.key === "Enter") sendCmd(); });

// ---- Connection ----------------------------------------------------------

async function connect() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [ADSB_SVC] }, { namePrefix: "ADSBee" }],
      optionalServices: [ADSB_SVC, NUS_SVC],
    });
    device.addEventListener("gattserverdisconnected", () => {
      $("state").textContent = "Disconnected (receiver rebooted or out of range)";
      $("send").disabled = true;
    });
    $("state").textContent = "Connecting…";
    const server = await device.gatt.connect();

    const adsb = await server.getPrimaryService(ADSB_SVC);
    for (const [kind, uuid] of Object.entries(CH)) {
      try {
        const c = await adsb.getCharacteristic(uuid);
        await c.startNotifications();
        c.addEventListener("characteristicvaluechanged", ev => onData(kind, ev));
      } catch (e) { /* characteristic optional (e.g. older firmware without uplink) */ }
    }

    try {
      const nus = await server.getPrimaryService(NUS_SVC);
      nusRx = await nus.getCharacteristic(NUS_RX);
      const nusTx = await nus.getCharacteristic(NUS_TX);
      await nusTx.startNotifications();
      nusTx.addEventListener("characteristicvaluechanged",
        ev => termWrite(termDecoder.decode(ev.target.value)));
      $("send").disabled = false;
      termWrite("console connected\n");
    } catch (e) {
      termWrite("console service unavailable on this firmware\n");
    }

    $("state").textContent = `Connected: ${device.name || "ADSBee"}`;
    $("mtu").textContent = "negotiated";
  } catch (e) {
    $("state").textContent = `Error: ${e.message}`;
  }
}

if (!navigator.bluetooth) {
  $("state").textContent = "Web Bluetooth unavailable - use Chrome/Edge over HTTPS or localhost";
  $("connect").disabled = true;
} else {
  $("connect").onclick = connect;
}
</script>
</body>
</html>
