{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fleet{% endblock %} · ADSBee</title>
<link rel="stylesheet" href="{% static 'adsbee_fleet/fleet.css' %}">
{% block head %}{% endblock %}
</head>
<body>
<header>
  <a class="brand" href="{% url 'adsbee_fleet:devices' %}" title="Devices">⬡ Fleet</a>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'adsbee_fleet:devices' %}" title="Devices and map">◉ Bees</a>
    <a href="{% url 'adsbee_fleet:rollouts' %}" title="Firmware rollouts">⇪ Rollouts</a>
    <a href="{% url 'adsbee_fleet:account' %}" title="Enroll token and API tokens">⚷ {{ user.get_username }}</a>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link" title="Sign out">⏏</button></form>
  </nav>
  {% endif %}
</header>
<main>
{% for message in messages %}<p class="msg {{ message.tags }}">{{ message }}</p>{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
